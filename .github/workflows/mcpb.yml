name: Claude Desktop bundle

# Builds garmin-mcp.mcpb with scripts/build_mcpb.py, then installs and starts
# it the way Claude Desktop does (scripts/mcpb_smoke_test.py) on Linux, macOS
# and Windows, each with the pinned uv and with Desktop's fallback uv. Pull
# requests stop there and keep the bundle as a run artifact for manual
# testing. release.yml calls this workflow for each release with
# publish: true, which attests the tested bundle and attaches it to the
# GitHub release.

on:
  pull_request:
    branches: [ main, master ]
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      version:
        description: Release version the bundle must carry (and release tag to attach to)
        required: false
        type: string
        default: ''
      publish:
        description: Attest the bundle and attach it to the release
        required: false
        type: boolean
        default: false
      replace_assets:
        description: Replace a garmin-mcp.mcpb that is already on the release
        required: false
        type: boolean
        default: false

concurrency:
  # Release calls get their own group so a queued publish is never dropped.
  group: mcpb-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - name: Check for a bundle manifest
      id: check
      run: |
        # Release tags from before the bundle existed have nothing to build.
        if [ -f mcpb/manifest.json ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::No mcpb/manifest.json at this commit, so there is no bundle to build"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      if: steps.check.outputs.skip == 'false'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: mcpb/package-lock.json

    - name: Install uv
      if: steps.check.outputs.skip == 'false'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        # Same uv as the Dockerfile; keep the two (and the smoke matrix) in step.
        version: 0.12.23
        enable-cache: false

    - name: Build bundle
      id: build
      if: steps.check.outputs.skip == 'false'
      env:
        VERSION: ${{ inputs.version }}
      run: |
        python3 scripts/build_mcpb.py --expect-version "$VERSION"
        echo "sha256=$(sha256sum dist/garmin-mcp.mcpb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Upload bundle
      if: steps.check.outputs.skip == 'false'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # Uploaded as-is (artifact name = file name) so it can be opened in
        # Claude Desktop straight from the run page.
        path: dist/garmin-mcp.mcpb
        archive: false
        if-no-files-found: error
        retention-days: 7

  smoke:
    needs: pack
    if: needs.pack.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # 0.9.7 is the uv Claude Desktop downloads when none is installed,
        # which is what most macOS and Windows users get.
        uv: [ '0.12.23', '0.9.7' ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - name: Install uv
      # No python-version: it would export UV_PYTHON and override the
      # bundle's .python-version.
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: ${{ matrix.uv }}
        enable-cache: false

    - name: Download bundle
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: garmin-mcp.mcpb
        path: ${{ runner.temp }}/bundle
        # A .mcpb is a zip; keep it as one file.
        skip-decompress: true

    - name: Smoke test
      shell: bash
      env:
        # The runner's own Python; on Windows `python3` can be the Store stub.
        PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
      run: '"$PYTHON" scripts/mcpb_smoke_test.py "$RUNNER_TEMP/bundle/garmin-mcp.mcpb"'

  attach:
    needs: [ pack, smoke ]
    if: inputs.publish && needs.pack.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SHA256: ${{ needs.pack.outputs.sha256 }}
      REPLACE: ${{ inputs.replace_assets }}

    # No checkout: this job only handles the artifact the smoke tests passed.
    steps:
    - name: Download bundle
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: garmin-mcp.mcpb
        skip-decompress: true

    - name: Check it is the bundle that was smoke-tested
      run: echo "$SHA256  garmin-mcp.mcpb" | sha256sum --check

    - name: Check for an existing asset
      id: existing
      run: |
        assets=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
        if grep -qx garmin-mcp.mcpb <<< "$assets" && [ "$REPLACE" != true ]; then
          echo "::notice::Release $VERSION already has garmin-mcp.mcpb; run with replace_assets to replace it"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Attest build provenance
      if: steps.existing.outputs.skip == 'false'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: garmin-mcp.mcpb

    - name: Attach to the release
      if: steps.existing.outputs.skip == 'false'
      run: |
        args=()
        if [ "$REPLACE" = true ]; then args+=(--clobber); fi
        gh release upload "$VERSION" garmin-mcp.mcpb --repo "$GITHUB_REPOSITORY" "${args[@]}"
